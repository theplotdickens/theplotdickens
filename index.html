<!DOCTYPE html>
<html>
<head>
  <title>Submissions with Dropdown No Indent</title>
  <style>
    ul#submissions li a {
  color: green;
  text-decoration: underline;
}

ul#submissions li a:hover {
  color: lightgreen;
}
    ul#submissions li {
      margin-bottom: 8px;
    }
    ul#submissions li a {
      color: dark green;
      text-decoration: underline;
    }
    #toggleBtn {
      margin-top: 10px;
      cursor: pointer;
      background-color: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 14px;
      user-select: none;
    }
  </style>
</head>
<body>
  <ul id="submissions">Loading...</ul>
  <button id="toggleBtn" style="display:none;">★Show Older News★</button>

  <script>
    const sheetID = "1TDHFyY3_s4X5hVJFHnrLQwHQdltlVcJEQVN880wd2TI";
    const sheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

    fetch(sheetURL)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;
        const list = document.getElementById("submissions");
        const toggleBtn = document.getElementById("toggleBtn");
        list.innerHTML = "";

        // Show first two normally
        rows.slice(0, 2).forEach(row => {
          const rawDate = row.c[1]?.f || "";
          const date = rawDate.split(' ')[0];
          const linkURL = row.c[2]?.v || "";
          const linkText = row.c[3]?.v || "";
          const desc = row.c[4]?.v || "";
          const li = document.createElement("li");
          li.innerHTML = `${date} <a href="${linkURL}" target="_blank" rel="noopener noreferrer">${linkText}</a> ${desc}`;
          list.appendChild(li);
        });

        if (rows.length > 2) {
          const hiddenDiv = document.createElement("div");
          hiddenDiv.style.display = "none";

          // Append li directly to the hidden div (no nested ul)
          rows.slice(2).forEach(row => {
            const rawDate = row.c[1]?.f || "";
            const date = rawDate.split(' ')[0];
            const linkURL = row.c[2]?.v || "";
            const linkText = row.c[3]?.v || "";
            const desc = row.c[4]?.v || "";
            const li = document.createElement("li");
            li.innerHTML = `${date} <a href="${linkURL}" target="_blank" rel="noopener noreferrer">${linkText}</a> ${desc}`;
            hiddenDiv.appendChild(li);
          });

          list.appendChild(hiddenDiv);

          toggleBtn.style.display = "inline-block";
          toggleBtn.onclick = () => {
            if (hiddenDiv.style.display === "none") {
              hiddenDiv.style.display = "block";
              toggleBtn.textContent = "Show Less ▲";
            } else {
              hiddenDiv.style.display = "none";
              toggleBtn.textContent = "Show More ▼";
            }
          };
        }
      })
      .catch(err => {
        document.getElementById("submissions").innerText = "Failed to load data.";
        console.error(err);
      });
  </script>
</body>
</html>
